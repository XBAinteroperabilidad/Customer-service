# nginx del login del backoffice (Customer-service).
#
# El clon trae dos configuraciones y ninguna sirve tal cual acá:
#   http-nginx.conf   escucha en 443 y redirige 80 -> https
#   https-nginx.conf  exige certificados en /etc/tls
# El stack publica este servicio en 3004 por HTTP (el TLS lo termina el proxy
# del organismo), así que escucha ahí y no redirige a ningún lado.
server {
    server_name localhost;
    listen 3004;

    server_tokens off;
    add_header Access-Control-Allow-Origin *;

    location / {
      root /usr/share/nginx/html/customer-service;
      try_files $uri /index.html;
    }

    location /status {
      access_log off;
      default_type text/plain;
      add_header Content-Type text/plain;
      return 200 "alive";
    }
}
